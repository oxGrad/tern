name: Pull Request

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: pr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: oxHive/pipelines/.github/actions/rust-check@v2
        with:
          # the sync worker and web layer need a live GitHub App and a browser,
          # so the pure core (score, rollup, parsing, DB) carries the coverage.
          fail-under-coverage: 30

  audit:
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
    steps:
      - uses: oxHive/pipelines/.github/actions/rust-audit@v2
