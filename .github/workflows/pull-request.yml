name: Pull Request

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: pr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: oxHive/pipelines/.github/actions/rust-check@v2
        with:
          # The sync runs against a mock GitHub (src/mock_github.rs) and the
          # web tests drive the real router, so only main.rs's CLI wiring is
          # untested. Same gate as publish.yml.
          fail-under-coverage: 70

  audit:
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
    steps:
      - uses: oxHive/pipelines/.github/actions/rust-audit@v2
