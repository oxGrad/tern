name: Publish

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    permissions:
      id-token: write
      contents: write
      pull-requests: read
      checks: write
      packages: write
    # Same shared pipeline as oxhive/mynd: verify version -> check -> audit ->
    # build (linux x86_64/arm64, macOS arm64) -> GitHub Release.
    uses: oxHive/pipelines/.github/workflows/rust-release.yml@v2
    with:
      package-name: tern
      binary-name: tern
      fail-under-coverage: "70"
      # The shared Homebrew step writes into the tap's Formula/ folder, which
      # would hide the formulae oxGrad/homebrew-tap keeps at its root (knot,
      # skein, spicebag). The `homebrew` job below publishes there instead.
      publish-homebrew: false
    # Only the secrets rust-release.yml declares, rather than `inherit`.
    secrets:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      DISCORD_ALERT_WEBHOOK_URL: ${{ secrets.DISCORD_ALERT_WEBHOOK_URL }}

  homebrew:
    needs: release
    if: ${{ !contains(github.ref_name, '-rc') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      # The same tarballs the GitHub Release was created from (same run).
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: tern-*
          merge-multiple: true

      - name: Write formula
        run: .github/scripts/homebrew-formula.sh "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY" artifacts > tern.rb

      - uses: actions/checkout@v7
        with:
          repository: oxGrad/homebrew-tap
          # Same secret name as knot/skein/spicebag: a token with write access
          # to oxGrad/homebrew-tap.
          token: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          path: tap

      - name: Push formula
        working-directory: tap
        run: |
          cp ../tern.rb tern.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tern.rb
          if git diff --cached --quiet; then
            echo "formula unchanged"
            exit 0
          fi
          git commit -m "Brew formula update for tern version $GITHUB_REF_NAME"
          git push
