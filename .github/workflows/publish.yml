name: Publish

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    permissions:
      id-token: write
      contents: write
      pull-requests: read
      checks: write
      packages: write
    # Same shared pipeline as oxhive/mynd: verify version -> check -> audit ->
    # build (linux x86_64/arm64, macOS arm64) -> GitHub Release -> Homebrew.
    uses: oxHive/pipelines/.github/workflows/rust-release.yml@v2
    with:
      package-name: tern
      binary-name: tern
      # Matches pull-request.yml; the pipeline's default is 60.
      fail-under-coverage: "30"
      publish-homebrew: true
      # oxhive/homebrew-tap, like mynd. Not oxGrad/homebrew-tap: the shared
      # action writes into Formula/, which would hide the formulae that tap
      # keeps at its root (knot, skein, spicebag).
      homebrew-owner: oxhive
      homebrew-tap: homebrew-tap
      homebrew-install: 'bin.install "tern"'
      homebrew-test-command: 'system "#{bin}/tern", "--version"'
    # Only the secrets rust-release.yml declares, rather than `inherit`.
    # HOMEBREW_TAP_TOKEN (a PAT with write access to oxhive/homebrew-tap) is
    # the path that works from this org: the HOMEBREW_APP_* path mints a token
    # for repos named in the oxhive org, and tern lives in oxGrad.
    secrets:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      DISCORD_ALERT_WEBHOOK_URL: ${{ secrets.DISCORD_ALERT_WEBHOOK_URL }}
